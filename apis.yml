aid: kuma
name: Kuma
description: >-
  Kuma is a platform-agnostic open-source service mesh built on top of Envoy proxy. It provides universal connectivity,
  security, and observability for services and microservices running on any infrastructure including Kubernetes and VMs.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/kuma.png
tags:
  - Envoy
  - Kubernetes
  - Microservices
  - Security
  - Service Mesh
url: https://raw.githubusercontent.com/api-evangelist/kuma/refs/heads/main/apis.yml
created: '2026-03-16'
modified: '2026-05-19'
specificationVersion: '0.23'
apis:
- aid: kuma:kuma-kubernetes-policy-api
  name: Kuma Kubernetes Policy API
  description: >-
    Kuma extends the Kubernetes API server with Custom Resource Definitions (CRDs) for defining and managing
    service mesh policies. These resources include MeshTrafficPermission, MeshRetry, MeshTimeout, MeshCircuitBreaker,
    MeshHealthCheck, MeshFaultInjection, and MeshRateLimit, enabling fine-grained traffic management,
    security, and resilience policies for meshed workloads.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://kuma.io/docs/latest/policies/
  tags:
  - CRD
  - Kubernetes
  - Policy
  - Traffic Management
  properties:
  - type: Documentation
    url: https://kuma.io/docs/latest/policies/
  - type: Reference
    url: https://kuma.io/docs/latest/reference/kubernetes-annotations/
- aid: kuma:kuma-multizone-api
  name: Kuma Multizone API
  description: >-
    Kuma's Multizone deployment API enables managing service meshes across multiple Kubernetes clusters
    and Universal zones from a single global control plane. It provides resources for zone management,
    cross-zone traffic routing, and zone egress and ingress configuration.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://kuma.io/docs/latest/production/deployment/multi-zone/
